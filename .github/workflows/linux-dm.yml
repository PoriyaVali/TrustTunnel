name: linux-dm

# Our own build for the TrustTunnel server, kept separate from upstream's
# workflows so a rebase never has to reconcile them. Upstream's jobs are all
# gated on `github.repository == 'TrustTunnel/TrustTunnel'`, so none of them
# run here; this one is the fork's only CI.
#
# Upstream builds on AdGuard's private `ephemeral-linux` runners inside their
# own container image. That is unavailable to us, so this reproduces the same
# thing on a stock runner: the dependency list comes from upstream's Dockerfile
# and the toolchain from rust-toolchain.toml.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.95 --profile minimal

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libclang-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Run tests
        run: cargo test --workspace

  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      # Report on every target. A musl cross-build can fail for reasons that
      # say nothing about the gnu build, and we want to see both results.
      fail-fast: false
      matrix:
        include:
          # Matches our own Debian servers, and is the target we would deploy
          # first.
          - target: x86_64-unknown-linux-gnu
          # Static, so it runs on any node regardless of glibc version.
          - target: x86_64-unknown-linux-musl
          # For arm64 nodes.
          - target: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.95 --profile minimal --target ${{ matrix.target }}

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libclang-dev

      # The workspace compiles C (lib/src/net_utils.c) through the cc crate, so
      # a cross-build needs a C cross-compiler as well as the Rust target.
      - name: musl cross toolchain
        if: contains(matrix.target, 'musl')
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y musl-tools musl-dev
            echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y gcc-aarch64-linux-gnu
            echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Same two binaries the Makefile and upstream's Dockerfile produce.
      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }} \
            --bin trusttunnel_endpoint --bin setup_wizard

      # The workspace sets `debug = true` on the release profile, so the linked
      # binaries carry full symbols. Keep both: the stripped one to deploy, the
      # original for reading a crash.
      - name: Strip
        run: |
          cd target/${{ matrix.target }}/release
          echo "before:"; ls -lh trusttunnel_endpoint setup_wizard | awk '{print $5, $9}'
          for b in trusttunnel_endpoint setup_wizard; do
            cp "$b" "$b.debug"
            if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
              aarch64-linux-gnu-strip "$b" || true
            else
              strip "$b" || true
            fi
          done
          echo "after:"; ls -lh trusttunnel_endpoint setup_wizard | awk '{print $5, $9}'

      - name: Sanity check
        run: |
          cd target/${{ matrix.target }}/release
          file trusttunnel_endpoint
          # Only a native binary can be executed on the runner.
          if [ "${{ matrix.target }}" != "aarch64-unknown-linux-musl" ]; then
            ./trusttunnel_endpoint --help || ./trusttunnel_endpoint --version || true
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/trusttunnel_endpoint
            target/${{ matrix.target }}/release/setup_wizard
          if-no-files-found: error
