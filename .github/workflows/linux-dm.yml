name: linux-dm

# Our own build for the TrustTunnel server, kept separate from upstream's
# workflows so a rebase never has to reconcile them. Upstream's jobs are all
# gated on `github.repository == 'TrustTunnel/TrustTunnel'`, so none of them
# run here; this one is the fork's only CI.
#
# Upstream builds on AdGuard's private `ephemeral-linux` runners inside their
# own container image. That is unavailable to us, so this reproduces the same
# thing on a stock runner: the dependency list comes from upstream's Dockerfile
# and the toolchain from rust-toolchain.toml.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.95 --profile minimal

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libclang-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: Run tests
        run: cargo test --workspace

  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      # Report on every target. A musl cross-build can fail for reasons that
      # say nothing about the gnu build, and we want to see both results.
      fail-fast: false
      matrix:
        include:
          # Links against the runner's glibc, so it only runs on a box at
          # least as new as the runner. Kept for a quick native smoke test.
          - target: x86_64-unknown-linux-gnu
          # Static, and therefore the one we actually deploy: our servers run
          # Debian 11 (glibc 2.31) while the runner is far newer.
          - target: x86_64-unknown-linux-musl
          # For arm64 nodes.
          - target: aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.95 --profile minimal --target ${{ matrix.target }}

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libclang-dev

      # A musl build needs a cross *C++* compiler, not just a C one: boring-sys
      # builds BoringSSL through CMake, which stops at CMAKE_CXX_COMPILER.
      # Ubuntu's musl-tools ships musl-gcc with no musl-g++, which is why the
      # obvious apt package is not enough. Upstream solves this with a full
      # cross toolchain baked into their own container image; zig carries both
      # halves for every musl target in one download, which is the equivalent
      # on a stock runner.
      - name: Install zig
        if: contains(matrix.target, 'musl')
        run: pip3 install ziglang

      - name: Install cargo-zigbuild
        if: contains(matrix.target, 'musl')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      # Only needed to strip the arm64 binary; the compiler itself comes from zig.
      - name: arm64 binutils
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: sudo apt-get install -y binutils-aarch64-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Same two binaries the Makefile and upstream's Dockerfile produce.
      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ]; then
            cargo build --release --target ${{ matrix.target }} \
              --bin trusttunnel_endpoint --bin setup_wizard
          else
            cargo zigbuild --release --target ${{ matrix.target }} \
              --bin trusttunnel_endpoint --bin setup_wizard
          fi

      # The workspace sets `debug = true` on the release profile, so the linked
      # binaries carry full symbols. Keep both: the stripped one to deploy, the
      # original for reading a crash.
      - name: Strip
        run: |
          cd target/${{ matrix.target }}/release
          echo "before:"; ls -lh trusttunnel_endpoint setup_wizard | awk '{print $5, $9}'
          for b in trusttunnel_endpoint setup_wizard; do
            cp "$b" "$b.debug"
            if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
              aarch64-linux-gnu-strip "$b"
            else
              strip "$b"
            fi
          done
          echo "after:"; ls -lh trusttunnel_endpoint setup_wizard | awk '{print $5, $9}'

      - name: Sanity check
        run: |
          cd target/${{ matrix.target }}/release
          file trusttunnel_endpoint
          # The whole point of the musl targets is that they carry no libc
          # dependency, so assert it rather than trusting the target name.
          if [ "${{ matrix.target }}" != "x86_64-unknown-linux-gnu" ]; then
            file trusttunnel_endpoint | grep -q "statically linked" \
              || { echo "musl build is not static"; exit 1; }
          fi
          # Only an x86_64 binary can be executed on the runner.
          if [ "${{ matrix.target }}" != "aarch64-unknown-linux-musl" ]; then
            ./trusttunnel_endpoint --help
          fi

      # Actually run it. `--help` proves the binary loads; it does not prove the
      # endpoint reaches a listening state, and it says nothing about signals.
      # Two releases shipped startup bugs that every other check here passed.
      - name: Starts, listens, and survives SIGHUP
        if: matrix.target != 'aarch64-unknown-linux-musl'
        run: |
          set -eu
          cd target/${{ matrix.target }}/release
          work="$(mktemp -d)"
          # Generate and run from the same directory, exactly as V2bX does
          # (cmd.Dir = dir, relative --lib-settings). The wizard writes
          # credentials_file relative to where it ran, so splitting the two
          # leaves a path the endpoint cannot resolve - which is what this
          # test got wrong on its first run.
          cp ./trusttunnel_endpoint ./setup_wizard "$work/"
          cd "$work"
          ./setup_wizard -m non-interactive \
            -n ci.local -a 127.0.0.1:18443 -c "ci:ci" \
            --lib-settings ./vpn.toml --hosts-settings ./hosts.toml \
            --cert-type self-signed >/dev/null

          ./trusttunnel_endpoint ./vpn.toml ./hosts.toml -l info > out.log 2>&1 &
          pid=$!

          # Wait for it to listen rather than sleeping a fixed time.
          for _ in $(seq 1 60); do
            grep -q "Listening to TCP" out.log && break
            kill -0 "$pid" 2>/dev/null || { echo "endpoint exited during startup:"; cat out.log; exit 1; }
            sleep 0.5
          done
          grep -q "Listening to TCP" out.log || { echo "never listened:"; cat out.log; exit 1; }

          # The signal a panel sends as soon as a node appears. It must reload,
          # not terminate - and the process id must not change.
          kill -HUP "$pid"
          sleep 3
          kill -0 "$pid" 2>/dev/null || { echo "SIGHUP killed the endpoint:"; cat out.log; exit 1; }

          # A second scenario - signalling immediately after a restart - was
          # tried here and removed: it reuses the port of the process it just
          # killed, so it fails on the bind race rather than on anything to do
          # with signals. The check above already covers both bugs that reached
          # production: an endpoint killed by SIGHUP fails the "still alive"
          # assertion, and one that panics before listening fails "never listened".
          kill -TERM "$pid" 2>/dev/null || true

          echo "started, listened, and survived SIGHUP"

      - uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/trusttunnel_endpoint
            target/${{ matrix.target }}/release/setup_wizard
          if-no-files-found: error
